<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tableau de bord</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <h1>Tableau de bord de production</h1>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-value" th:attr="data-count-target=${stats.totalCommandes}">0</span>
            <span class="stat-label">Commandes au total</span>
        </div>
        <div class="stat-card stat-alert">
            <span class="stat-value" th:attr="data-count-target=${stats.commandesEnRetard}">0</span>
            <span class="stat-label">Commandes en retard</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" th:attr="data-count-target=${stats.tauxRetardPourcentage}">0%</span>
            <span class="stat-label">Taux de retard</span>
        </div>
    </div>

    <h2>Répartition par statut</h2>
    <div th:each="entry : ${stats.commandesParStatut}" class="bar-row">
        <span class="bar-label" th:text="${entry.key}">STATUT</span>
        <div class="bar-track">
            <div class="bar-fill" th:attr="data-target-width=(${stats.totalCommandes} > 0 ? (${entry.value} * 100 / ${stats.totalCommandes}) : 0)"></div>
        </div>
        <span class="bar-count" th:text="${entry.value}">0</span>
    </div>

    <h2>Répartition par priorité</h2>
    <div th:each="entry : ${stats.commandesParPriorite}" class="bar-row">
        <span class="bar-label" th:text="${entry.key}">PRIORITE</span>
        <div class="bar-track">
            <div class="bar-fill" th:attr="data-target-width=(${stats.totalCommandes} > 0 ? (${entry.value} * 100 / ${stats.totalCommandes}) : 0)"></div>
        </div>
        <span class="bar-count" th:text="${entry.value}">0</span>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
