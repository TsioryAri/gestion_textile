<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<div class="login-card">
    <h1>Gestion Textile</h1>
    <p class="login-subtitle">Connectez-vous pour accéder à votre espace</p>

    <div class="alert-error" th:if="${param.error}">Nom d'utilisateur ou mot de passe incorrect.</div>
    <div class="alert-success" th:if="${param.logout}">Vous avez été déconnecté avec succès.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Se connecter</button>
    </form>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
