services:
  postgres:
    image: postgres:16
    container_name: textile-postgres
    environment:
      POSTGRES_DB: textile_db
      POSTGRES_USER: textile_user
      POSTGRES_PASSWORD: textile_pass
    ports:
      - "5432:5432"
    volumes:
      - textile_pgdata:/var/lib/postgresql/data

volumes:
  textile_pgdata:
